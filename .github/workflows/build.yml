name: WaveRoll CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js with specific version
      - name: Setup Node.js 24.1.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.1.0"

      # Step 3: Setup Bun package manager
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Step 4: Cache Bun's global install cache
      - name: Setup Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Step 5: Install project dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Step 6: Run TypeScript type checking
      - name: Type check
        run: bun run typecheck

      # Step 7: Build the project
      - name: Build project
        run: bun run build

      # Step 8: Upload build artifacts (optional)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 7
